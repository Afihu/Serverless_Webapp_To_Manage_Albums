openapi: 3.0.0
info:
  title: Get Upload URL
  version: 2.0.0
  description: |
    Generate a presigned S3 POST URL for direct image uploads.
    
    This endpoint allows clients to upload images directly to S3 without streaming through Lambda,
    bypassing timeout and memory constraints for large files (up to 50 MB).
    
    **Note**: This is part of the operation-based API contract structure. See `README.md` in this directory for the complete API overview.

servers:
  - url: <Placeholder for API Gateway URL>
    description: Production API Gateway

security:
  - BearerAuth: []

paths:
  /albums/{albumId}/images/presigned-upload:
    post:
      summary: Get Presigned Upload URL
      operationId: getPresignedUploadURL
      description: Generate a presigned S3 URL for direct image upload
      tags:
        - Images
      parameters:
        - name: albumId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetUploadURLRequest'
      responses:
        200:
          description: Presigned upload URL generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetUploadURLResponse'
        400:
          description: Invalid request (missing fields, invalid format, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        401:
          description: Unauthorized - missing or invalid JWT token
        404:
          description: Album not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        413:
          description: File too large (max 50 MB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token from authentication provider

  schemas:
    GetUploadURLRequest:
      type: object
      required:
        - fileName
        - fileSize
        - fileFormat
      properties:
        fileName:
          type: string
          maxLength: 255
          description: Original filename (e.g., "vacation-photo.jpg")
          example: "vacation-photo-1.jpg"
        fileSize:
          type: integer
          maximum: 52428800
          description: File size in bytes (max 50 MB = 52,428,800 bytes)
          example: 2097152
        fileFormat:
          type: string
          enum: ["JPEG", "PNG", "WebP", "GIF"]
          description: Image format (validates file type)
          example: "JPEG"

    GetUploadURLResponse:
      type: object
      required:
        - imageId
        - uploadUrl
        - expiresIn
        - uploadMethod
        - maxFileSize
      properties:
        imageId:
          type: string
          format: uuid
          description: Pre-generated image ID (created in DynamoDB immediately)
          example: "660e8400-e29b-41d4-a716-446655440001"
        uploadUrl:
          type: string
          format: uri
          description: Presigned S3 POST URL (valid for 15 minutes)
          example: "https://s3.amazonaws.com/album-bucket/"
        expiresIn:
          type: integer
          description: URL expiration time in seconds
          example: 900
        uploadMethod:
          type: string
          enum: ["POST"]
          description: HTTP method to use for upload
          example: "POST"
        maxFileSize:
          type: integer
          description: Maximum file size allowed in bytes
          example: 52428800

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - NOT_FOUND
                - UNAUTHORIZED
                - FILE_TOO_LARGE
                - INVALID_FORMAT
                - INTERNAL_ERROR
              example: "VALIDATION_ERROR"
            message:
              type: string
              example: "File size exceeds maximum of 50 MB"
            details:
              type: object
              nullable: true
              example:
                maxSize: 52428800
                requestedSize: 104857600
