openapi: 3.0.0
info:
  title: Delete Entry
  version: 2.0.0
  description: |
    Delete an album or image.
    
    - For `type=album`: Deletes the album and cascades to delete all associated images from S3 and DynamoDB
    - For `type=image`: Deletes the image from DynamoDB and S3 (both original and thumbnail)
    
    **Note**: This is part of the operation-based API contract structure. See `README.md` in this directory for the complete API overview.

servers:
  - url: <Placeholder for API Gateway URL>
    description: Production API Gateway

security:
  - BearerAuth: []

paths:
  /albums/{albumId}:
    delete:
      summary: Delete Album
      operationId: deleteAlbum
      description: Delete an entire album and all its images from S3 and DynamoDB
      tags:
        - Albums
      parameters:
        - name: albumId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        204:
          description: Album deleted successfully
        401:
          description: Unauthorized - missing or invalid JWT token
        404:
          description: Album not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /albums/{albumId}/images/{imageId}:
    delete:
      summary: Delete Image
      operationId: deleteImage
      description: Delete an image from an album (removes from S3 and DynamoDB)
      tags:
        - Images
      parameters:
        - name: albumId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: imageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        204:
          description: Image deleted successfully
        401:
          description: Unauthorized - missing or invalid JWT token
        404:
          description: Image or album not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token from authentication provider

  schemas:
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - NOT_FOUND
                - UNAUTHORIZED
                - INTERNAL_ERROR
              example: "NOT_FOUND"
            message:
              type: string
              example: "Album not found"
            details:
              type: object
              nullable: true
