openapi: 3.0.0
info:
  title: Get Download URL
  version: 1.0.0
  description: |
    Get presigned S3 URLs for downloading photos or thumbnails.
    Supports `resourceType` query parameter: `original` (default) or `thumbnail`.
    
    **Note**: This is part of the modular API contract structure. See `README.md` in this directory for the complete API overview and list of all contracts.

servers:
  - url: <Placeholder for API Gateway URL>
    description: Production API Gateway

security:
  - BearerAuth: []

paths:
  /photos/{photoId}/presigned-download:
    post:
      summary: Get Download URL
      operationId: getDownloadURL
      description: Get a presigned S3 URL for downloading a photo resource (original or thumbnail)
      tags:
        - Photos
      parameters:
        - name: photoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: resourceType
          in: query
          schema:
            type: string
            enum: ["original", "thumbnail"]
            default: "original"
          description: Type of resource to download. Defaults to 'original' for backward compatibility.
          example: "thumbnail"
      responses:
        200:
          description: Presigned download URL generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  downloadUrl:
                    type: string
                    format: uri
                    description: Presigned S3 URL for requested resource (valid for 15 minutes)
                  resourceType:
                    type: string
                    enum: ["original", "thumbnail"]
                    description: Type of resource for which the URL was generated
                  expiresIn:
                    type: integer
                    description: URL expiration time in seconds
                    example: 900
        202:
          description: Thumbnail generation in progress (only for resourceType=thumbnail)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: ["pending"]
                    example: "pending"
                  resourceType:
                    type: string
                    example: "thumbnail"
                  message:
                    type: string
                    example: "Thumbnail generation in progress"
        401:
          description: Unauthorized
        404:
          description: Photo not found or resource not available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        500:
          description: Internal server error

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token from authentication provider

  schemas:
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - NOT_FOUND
                - UNAUTHORIZED
                - FILE_TOO_LARGE
                - INVALID_FORMAT
                - INTERNAL_ERROR
              example: "NOT_FOUND"
            message:
              type: string
              example: "Photo not found"
            details:
              type: object
              nullable: true
