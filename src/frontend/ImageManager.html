<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>S3 Image Manager</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h1>🖼️ S3 Image Manager</h1>
    <p style="color: var(--muted); margin-bottom: 2rem;">Upload, view, and manage images</p>

    <!-- Messages -->
    <div id="message" class="message"></div>

    <!-- Upload Section -->
    <div class="section">
      <h2>📤 Upload Image</h2>
      <div class="form-group">
        <label for="uploadFile">Select Image File</label>
        <input type="file" id="uploadFile" accept="image/*" />
      </div>
      <button onclick="handleUpload()">
        <span class="htmx-indicator"><span class="loading"></span>&nbsp;</span>
        Upload
      </button>
    </div>

    <!-- Image Gallery Section -->
    <div class="section">
      <h2>🖼️ Image Gallery</h2>
      <button onclick="loadImages()" style="margin-bottom: 1rem;">
        <span class="htmx-indicator"><span class="loading"></span>&nbsp;</span>
        Refresh Gallery
      </button>
      <div id="gallery" class="gallery">
        <p style="color: var(--muted); grid-column: 1/-1;">Loading images...</p>
      </div>
    </div>

    <!-- Image Modal for Viewing -->
    <div id="imageModal" class="modal" style="display: none;">
      <div class="modal-content">
        <span class="modal-close" onclick="closeImageModal()">&times;</span>
        <img id="modalImage" src="" alt="Image Preview" />
      </div>
    </div>
  </div>

  <script>
    // Initialize gallery on page load
    document.addEventListener('DOMContentLoaded', loadImages);

    function showMessage(message, type = 'success') {
      const msgEl = document.getElementById('message');
      msgEl.textContent = message;
      msgEl.className = `message show ${type}`;
      setTimeout(() => {
        msgEl.classList.remove('show');
      }, 5000);
    }

    function loadImages() {
      const gallery = document.getElementById('gallery');
      gallery.innerHTML = '<p style="color: var(--muted); grid-column: 1/-1;">Loading...</p>';

      fetch('/my-helloworld-app/api/list-objects')
        .then(response => {
          if (!response.ok) throw new Error('Failed to load images');
          return response.json();
        })
        .then(images => {
          if (!images || images.length === 0) {
            gallery.innerHTML = '<p style="color: var(--muted); grid-column: 1/-1;">No images found</p>';
            return;
          }

          gallery.innerHTML = '';
          images.forEach(image => {
            const card = createImageCard(image);
            gallery.appendChild(card);
          });
        })
        .catch(error => {
          console.error('Error loading images:', error);
          gallery.innerHTML = `<p style="color: var(--danger); grid-column: 1/-1;">Error: ${error.message}</p>`;
        });
    }

    function createImageCard(imageKey) {
      const card = document.createElement('div');
      card.className = 'image-card';

      const objectUrl = `/my-helloworld-app/object/${imageKey}`;
      const previewUrl = `/my-helloworld-app/object/${imageKey}`;

      card.innerHTML = `
        <div class="image-preview">
          <img src="${previewUrl}" alt="${imageKey}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22%3E%3Crect fill=%22%23333%22 width=%22200%22 height=%22200%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 font-family=%22Arial%22 font-size=%2214%22 fill=%22%23999%22%3EImage not found%3C/text%3E%3C/svg%3E';" />
        </div>
        <div class="image-name">${imageKey}</div>
        <div class="image-actions">
          <button class="btn-view" onclick="viewImage('${imageKey}')">View</button>
          <button class="btn-download" onclick="downloadImage('${imageKey}')">Download</button>
          <button class="btn-delete" onclick="deleteImage('${imageKey}')">Delete</button>
        </div>
      `;

      return card;
    }

    function viewImage(imageKey) {
      const modal = document.getElementById('imageModal');
      const modalImage = document.getElementById('modalImage');
      modalImage.src = `/my-helloworld-app/object/${imageKey}`;
      modal.style.display = 'flex';
    }

    function closeImageModal() {
      const modal = document.getElementById('imageModal');
      modal.style.display = 'none';
    }

    // Close modal when clicking outside the image
    window.onclick = function(event) {
      const modal = document.getElementById('imageModal');
      if (event.target === modal) {
        modal.style.display = 'none';
      }
    }

    function downloadImage(imageKey) {
      fetch(`/my-helloworld-app/api/download-url/${imageKey}`)
        .then(response => response.json())
        .then(data => {
          const a = document.createElement('a');
          a.href = data.url;
          a.download = imageKey;
          a.click();
        })
        .catch(error => showMessage(`Error: ${error.message}`, 'error'));
    }

    function deleteImage(imageKey) {
      if (!confirm(`Are you sure you want to delete "${imageKey}"?`)) return;

      fetch(`/my-helloworld-app/api/delete/${imageKey}`, { method: 'DELETE' })
        .then(response => response.json())
        .then(data => {
          showMessage('Image deleted successfully!', 'success');
          loadImages();
        })
        .catch(error => showMessage(`Error: ${error.message}`, 'error'));
    }

    function handleUpload() {
      const fileInput = document.getElementById('uploadFile');
      const file = fileInput.files[0];

      if (!file) {
        showMessage('Please select a file', 'error');
        return;
      }

      // Get presigned upload URL
      fetch(`/my-helloworld-app/api/upload-url?filename=${encodeURIComponent(file.name)}`, { method: 'POST' })
        .then(response => response.json())
        .then(data => {
          if (data.error) throw new Error(data.error);

          // Upload file using presigned URL
          return fetch(data.url, {
            method: 'PUT',
            headers: { 'Content-Type': file.type },
            body: file
          });
        })
        .then(response => {
          if (!response.ok) throw new Error('Upload failed');
          showMessage('Image uploaded successfully!', 'success');
          fileInput.value = '';
          loadImages();
        })
        .catch(error => showMessage(`Upload error: ${error.message}`, 'error'));
    }
  </script>
</body>
</html>
